opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - nimble_operator
  - operator_usage_whitespace
  - prohibited_super_call
  - redundant_nil_coalescing
  - vertical_whitespace_closing_braces
  - yoda_condition
  
function_body_length:
  warning: 300
  error: 500

disabled_rules:
  - line_length
  - trailing_whitespace
  - identifier_name
  - function_body_length
  - type_body_length
  - file_length

included:
  - TSUMap

excluded:
  - Pods
  - Carthage
